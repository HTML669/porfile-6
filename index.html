<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Flip Cards</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Phetsarath OT', 'Noto Sans Lao', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            padding: 40px 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        /* Container ຈັດ layout ແບບ Grid 3 ຖໍ້າ x 2 ແຖວ */
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ໂຄງສ້າງ Flip Card 3D */
        .card {
            background-color: transparent;
            width: 100%;
            height: 380px;
            perspective: 1000px; /* ສ້າງມິຕິ 3D */
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        /* ເມື່ອກົດ ຫຼື Hover ໃຫ້ປິ່ນ 180 ອົງສາ */
        .card:hover .card-inner,
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* ດ້ານໜ້າ ແລະ ດ້ານຫຼັງ */
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Style ດ້ານໜ້າ */
        .card-front {
            background-color: #ffffff;
            color: #333;
        }

        .card-front img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #4F46E5;
            margin-bottom: 15px;
        }

        .card-front h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .card-front p {
            color: #666;
            font-size: 0.9rem;
        }

        /* Style ດ້ານຫຼັງ */
        .card-back {
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            color: white;
            transform: rotateY(180deg);
        }

        .card-back img {
            width: 100%;
            height: 100%;
            /* object-fit: cover; */
            border-radius: 10px;
            /* margin-bottom: 15px; */
        }

        .card-back h4 {
            margin-bottom: 8px;
        }

        .card-back p {
            font-size: 0.85rem;
            opacity: 0.9;
            line-height: 1.4;
        }

        .hint {
            margin-top: 10px;
            font-size: 0.75rem;
            opacity: 0.7;
        }
    </style>
</head>
